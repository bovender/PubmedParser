name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "*" ]

jobs:
  test:
    name: "PHPUnit: MW ${{ matrix.mw }}, PHP ${{ matrix.php }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Current Long-Term Support release
          - mw: 'REL1_43'
            php: '8.1'
          # Legacy stable release
          - mw: 'REL1_45'
            php: '8.2'
          # Current stable release
          - mw: 'REL1_46'
            php: '8.3'
          # Development branch, to catch breakage early
          - mw: 'master'
            php: '8.3'
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.mw == 'master' }}
    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, sqlite3
          tools: composer

      - name: Checkout MediaWiki
        uses: actions/checkout@v4
        with:
          repository: wikimedia/mediawiki
          ref: ${{ matrix.mw }}
          path: mediawiki

      - name: Checkout PubmedParser
        uses: actions/checkout@v4
        with:
          path: mediawiki/extensions/PubmedParser

      - name: Install MediaWiki dependencies
        working-directory: mediawiki
        run: composer install --no-progress --prefer-dist

      - name: Install MediaWiki
        working-directory: mediawiki
        run: >
          php maintenance/install.php --pass pubmedparsertest --dbtype sqlite
          --extensions PubmedParser Tests admin

      # composer's "phpunit" script generates phpunit.xml before delegating to
      # PHPUnit, so it stays correct even if MediaWiki moves its entrypoint
      # (as happened between 1.46 and master).
      - name: Run PubmedParser's PHPUnit suite
        working-directory: mediawiki
        run: composer phpunit -- extensions/PubmedParser/tests/phpunit
